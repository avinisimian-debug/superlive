<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00d7ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" stroke="#334155" stroke-width="2" fill="none"/>

  <!-- Glowing Radar Concentric Stream Rings -->
  <circle cx="256" cy="256" r="190" stroke="#00d7ff" stroke-opacity="0.08" stroke-width="2" fill="none"/>
  <circle cx="256" cy="256" r="140" stroke="#00d7ff" stroke-opacity="0.12" stroke-width="2" fill="none"/>
  <circle cx="256" cy="256" r="90" stroke="#00d7ff" stroke-opacity="0.18" stroke-width="2" fill="none"/>

  <!-- Core Dynamic Z-Stream Glyph -->
  <path d="M140 160 C140 148 150 140 162 140 L350 140 C364 140 374 154 368 167 L226 332 L350 332 C362 332 372 342 372 354 C372 366 362 376 350 376 L162 376 C148 376 138 362 144 349 L286 184 L162 184 C150 184 140 174 140 160 Z" fill="url(#streamGrad)" filter="url(#glow)"/>

  <!-- Live Pulse Core Dot -->
  <circle cx="368" cy="144" r="18" fill="#00d7ff" filter="url(#glow)"/>
  <circle cx="368" cy="144" r="8" fill="#ffffff"/>
  
  <!-- Shopping Cart Wheel Accents -->
  <circle cx="180" cy="376" r="14" fill="#00d7ff"/>
  <circle cx="332" cy="376" r="14" fill="#10b981"/>
</svg>
